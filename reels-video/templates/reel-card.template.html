<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: linear-gradient(160deg, #fff1ec 0%, #ffe1ea 45%, #ffd0e0 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 96px 84px;
        text-align: center;
      }
      #badge {
        position: absolute;
        top: 96px;
        left: 50%;
        transform: translateX(-50%);
        padding: 18px 40px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        color: #b23a63;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.01em;
        opacity: 0;
      }
      #hook {
        color: #3a1520;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.02em;
        opacity: 0;
      }
      #body {
        margin-top: 56px;
        color: #6b3548;
        font-size: 52px;
        font-weight: 500;
        line-height: 1.4;
        opacity: 0;
      }
      #cta {
        position: absolute;
        bottom: 140px;
        left: 84px;
        right: 84px;
        padding: 44px 48px;
        border-radius: 40px;
        background: #b23a63;
        color: #fff5f8;
        font-size: 48px;
        font-weight: 700;
        line-height: 1.3;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div id="badge" class="clip" data-start="0" data-duration="10" data-track-index="0">{{TITLE}}</div>
      <h1 id="hook" class="clip" data-start="0.3" data-duration="9.7" data-track-index="1">{{HOOK}}</h1>
      <p id="body" class="clip" data-start="3.6" data-duration="6.4" data-track-index="2">{{BODY}}</p>
      <div id="cta" class="clip" data-start="7.2" data-duration="2.8" data-track-index="3">{{CTA}}</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#hook", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.3);
      tl.to("#hook", { opacity: 0, y: -24, duration: 0.5, ease: "power1.in" }, 3.2);
      tl.fromTo("#body", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.6);
      tl.to("#body", { opacity: 0, y: -20, duration: 0.5, ease: "power1.in" }, 6.8);
      tl.fromTo(
        "#cta",
        { opacity: 0, scale: 0.9, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" },
        7.2
      );
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
